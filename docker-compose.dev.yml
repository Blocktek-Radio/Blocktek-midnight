name: blocktek-radio-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blocktek_radio
      POSTGRES_USER: blocktek_radio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  redis:
    image: redis:7-alpine

networks:
  default:
    name: blocktek-radio-dev-network
    driver: bridge
